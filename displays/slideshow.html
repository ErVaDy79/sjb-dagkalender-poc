<!doctype html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dagkalender – Diavoorstelling</title>

    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/slideshow.css">
</head>
<body>
    <main id="calendar-page" class="calendar-page slideshow-page">
        <header class="calendar-header">
            <div id="calendar-date" class="calendar-date"></div>
        </header>

        <div
            id="calendar-status"
            class="calendar-status"
            aria-live="polite"
        ></div>

        <div id="slide-viewport" class="slideshow-viewport">
            <div id="slide-content" class="content slideshow-content">
                <div id="calendar-slides"></div>
            </div>
        </div>
    </main>

    <script type="module" src="../js/pages/slideshow-page.js"></script>
</body>
</html>
