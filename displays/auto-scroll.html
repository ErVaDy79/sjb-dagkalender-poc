<!doctype html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dagkalender – Automatisch scrollen</title>

    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/autoscroll.css">
</head>
<body>
    <main id="calendar-page" class="calendar-page auto-scroll-page">
        <div
            id="calendar-status"
            class="calendar-status"
            aria-live="polite"
        ></div>

        <div id="scroll-viewport" class="auto-scroll-viewport">
            <div id="scroll-content" class="content auto-scroll-content">
                <header class="calendar-header">
                    <div id="calendar-date" class="calendar-date"></div>
                </header>

                <div id="calendar-blocks"></div>
            </div>
        </div>
    </main>

    <script
        type="module"
        src="../js/pages/auto-scroll-page.js"
    ></script>
</body>
</html>
